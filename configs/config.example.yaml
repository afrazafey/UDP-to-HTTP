# Management remains local-only. Playback listeners have a separate CIDR policy.
log_format: json # text is available for an interactive console; restart required.
recovery:
  enabled: true
  min_delay: 250ms
  max_delay: 30s
  jitter: 0.2
  rejoin_after: 30s
  max_attempts: 0 # Unlimited retries with bounded delay; 0 does not disable backoff.
playlist:
  advertised_host: "" # Explicit reachable IPv4/hostname, without scheme or port.
  remote_enabled: false
  allowed_client_networks: [] # Additional restriction; playback CIDRs also apply.
management:
  host: 127.0.0.1
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s
  # Opt-in same-host Nginx support; see deploy/NGINX.md. YAML-only; restart required.
  reverse_proxy:
    enabled: false
    trusted_proxies: [] # TCP peer, e.g. ["127.0.0.1"], never the browser IP.
    trusted_origins: [] # Exact origins, e.g. ["http://192.168.10.103"].

network:
  multicast_interface: "" # Select a real interface name or local IPv4 address.
  http_interface: 127.0.0.1
  http_port: 7781
  secondary_http_port: 7782 # 0 disables the secondary playback listener.
  http_bind_addresses: [] # Optional explicit local IPv4 addresses; 0.0.0.0 is opt-in.

streaming:
  enabled: true
  udp_receive_buffer: 4194304
  stream_buffer: 8388608
  max_clients: 100
  connect_timeout: 10s
  allowed_client_networks: [] # Deny all playback until explicitly configured.
  allowed_multicast_groups: []
  allowed_unicast_sources: []
  blocked_multicast_networks: ["224.0.0.0/24"]
  allow_loopback_unicast: false
  max_streams: 128
  client_buffer_bytes: 262144
  max_buffered_bytes: 67108864
  inactivity_timeout: 10s
  client_write_timeout: 10s

# Imported into SQLite once, at the first Phase 2 startup. Thereafter use the API.
channels: []

storage:
  path: data/udphttp-proxy.db
logging:
  level: info
  retention_count: 2000
  retention_days: 7
dashboard:
  name: UDPHTTP Proxy
  theme: system
  refresh_seconds: 5
  default_startup: on_demand
  default_idle_seconds: 5
