# Example only. Merge into the existing authenticated vhost after reviewing deploy/NGINX.md.
server {
    listen 192.168.10.103:80;
    server_name 192.168.10.103;

    # BOTH conditions are required, including for HTML, JS, CSS, and API routes.
    satisfy all;
    allow 192.168.10.102;
    deny all;
    auth_basic "UDPHTTP management";
    auth_basic_user_file /etc/nginx/udphttp-proxy.htpasswd;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 127.0.0.1:8080;

        # Overwrite client-provided values. Do not append a client-controlled chain.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Prefix "";

        # Basic authentication is checked above. The Go daemon has no use for
        # the credentials; avoid sending them to the upstream application.
        proxy_set_header Authorization "";
        # Origin, Referer, Sec-Fetch-Site, and X-CSRF-Token pass through unchanged.
    }
}
