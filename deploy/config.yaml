# Packaged defaults. dpkg preserves this file as a conffile across upgrades.
management:
  host: 127.0.0.1
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s
network:
  multicast_interface: ""
  http_interface: 127.0.0.1
  http_port: 7781
  secondary_http_port: 7782
  http_bind_addresses: []
streaming:
  enabled: true
  udp_receive_buffer: 4194304
  stream_buffer: 8388608
  max_clients: 100
  connect_timeout: 10s
  allowed_client_networks: []
  allowed_multicast_groups: []
  allowed_unicast_sources: []
  blocked_multicast_networks: ["224.0.0.0/24"]
  allow_loopback_unicast: false
  max_streams: 128
  client_buffer_bytes: 262144
  max_buffered_bytes: 67108864
  inactivity_timeout: 10s
  client_write_timeout: 10s
channels: []
storage:
  path: /var/lib/udphttp-proxy/udphttp-proxy.db
logging:
  level: info
  retention_count: 2000
  retention_days: 7
dashboard:
  name: UDPHTTP Proxy
  theme: system
  refresh_seconds: 5
  default_startup: on_demand
  default_idle_seconds: 5
