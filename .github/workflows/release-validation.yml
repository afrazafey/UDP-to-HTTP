name: Reusable release validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: amd64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {os: windows-latest, arch: amd64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        shell: bash
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        shell: bash
        working-directory: frontend
      - name: Formatting, vet, and JSON test results
        shell: bash
        run: |
          mkdir -p build
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          set -o pipefail
          go test -json ./... | tee build/go-tests.jsonl
      - name: Race detector
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go test -race -json ./... | tee build/go-race.jsonl
      - name: Coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p build/coverage
          go test "-covermode=atomic" "-coverprofile=build/coverage/coverage.out" ./...
          go tool cover "-func=build/coverage/coverage.out" | tee build/coverage/summary.txt
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Build platform candidates
        shell: bash
        run: |
          python scripts/build-release.py --version 0.4.1-dev
          python scripts/verify-artifacts.py
      - name: Browser layouts and screenshots
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          npm install --prefix .tools/phase41-browser --no-save playwright-core@1.65.1
          node .tools/phase41-browser/node_modules/playwright-core/cli.js install --with-deps chromium
          node scripts/check-dashboard.mjs build/udphttp-proxy-linux-amd64 build/dashboard-screenshots ./.tools/phase41-browser/node_modules/playwright-core
      - name: Linux smoke and resource load
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/linux-smoke.py --binary "build/udphttp-proxy-linux-$ARCH"
          python3 scripts/load-test.py --binary "build/udphttp-proxy-linux-$ARCH"
      - name: Debian archive, clean install, upgrade and systemd lifecycle
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/test-debian-package.sh "build/udphttp-proxy_0.4.1~dev_$ARCH.deb" "$ARCH" | tee build/debian-acceptance.txt
      - name: Service diagnostics
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        run: sudo journalctl -u udphttp-proxy -n 150 --no-pager > build/debian-journal.txt
      - name: Native Windows service and resource load
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-windows-service.ps1 -Binary ./build/udphttp-proxy-windows-amd64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/load-test.py --binary build/udphttp-proxy-windows-amd64.exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-validation-${{ matrix.os }}
          path: build/
          retention-days: 14
