name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -v ./...
      - run: go test -race ./...
      - run: go test -coverprofile=build-coverage.out ./...
      - name: Build Linux binaries and packages
        run: |
          make linux VERSION=0.2.0-ci
          python3 scripts/linux-smoke.py --binary build/udphttp-proxy-linux-amd64
          sh scripts/build-deb.sh amd64 0.2.0~ci build/udphttp-proxy-linux-amd64
          sh scripts/build-deb.sh arm64 0.2.0~ci build/udphttp-proxy-linux-arm64
      - name: Inspect and smoke test Debian package
        run: |
          dpkg-deb --info build/udphttp-proxy_0.2.0~ci_amd64.deb
          sudo dpkg -i build/udphttp-proxy_0.2.0~ci_amd64.deb
          /usr/bin/udphttp-proxy version
          /usr/bin/udphttp-proxy config validate --config /etc/udphttp-proxy/config.yaml
          sudo systemd-analyze verify deploy/udphttp-proxy.service
          sudo systemctl restart udphttp-proxy
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8080/health
          echo '# upgrade-preservation-check' | sudo tee -a /etc/udphttp-proxy/config.yaml
          sudo dpkg -i build/udphttp-proxy_0.2.0~ci_amd64.deb
          grep upgrade-preservation-check /etc/udphttp-proxy/config.yaml
          sudo dpkg --remove udphttp-proxy
          test -f /etc/udphttp-proxy/config.yaml
          sudo dpkg --purge udphttp-proxy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-linux-builds
          path: build/
