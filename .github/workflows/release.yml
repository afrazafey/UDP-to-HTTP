name: UDPHTTP Proxy release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (for example 0.4.3-rc.1)
        required: true
        default: 0.4.3-rc.1
      create_draft:
        description: Approve creating a draft prerelease after successful validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/release-validation.yml
    with:
      version: ${{ inputs.version }}
  draft:
    if: inputs.create_draft
    needs: validate
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: build/candidate
      - name: Create approved draft using the tested package bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          cd build/candidate
          sha256sum --strict --check SHA256SUMS
          mapfile -t files < <(cut -c67- SHA256SUMS)
          gh release create "v$VERSION" "${files[@]}" SHA256SUMS --target "$SOURCE_SHA" --draft --prerelease --title "UDPHTTP Proxy $VERSION" --notes "Developed by Afraaz (https://afraaz.xyz). Review docs/PHASE4_3_REPORT.md and release gates before stable promotion."
